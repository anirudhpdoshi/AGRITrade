name: Coverage check (Brazil / World fundamentals)
on:
  push:
    branches: [coverage-gg]
    paths: ["scripts/coverage_gg3.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests openpyxl
      - name: Probe sources (read-only)
        env:
          FAS_API_KEY: ${{ secrets.FAS_API_KEY }}
        run: python scripts/coverage_gg3.py
      - name: Save results to this branch
        run: |
          git config user.name "coverage-bot"; git config user.email "coverage-bot@users.noreply.github.com"
          git add coverage/
          git commit -m "coverage results $(date -u +%FT%TZ)" || echo "no change"
          git push origin HEAD:coverage-gg
