name: dbg
on: { push: { branches: [cme-check] } }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          W=https://agritrade-sec.anirudh-p-doshi.workers.dev
          pip -q install pdfplumber
          curl -s -o c.pdf "$W/cme?s=56"; curl -s -o s.pdf "$W/cme?s=57"
          python - <<'P'
          import pdfplumber,re
          for f in ["c.pdf","s.pdf"]:
              with pdfplumber.open(f) as p:
                  print("#####",f,len(p.pages))
                  for i,pg in enumerate(p.pages):
                      t=pg.extract_text() or ""
                      L=t.split("\n")
                      heads=[l for l in L if re.search(r"(CALL|PUT)S?\b|OPT|TOTAL",l)][:12]
                      print("--- page",i+1, "| ".join(heads)[:900])
                      if i in (1,) or (f=="s.pdf" and i in (1,)):
                          print("\n".join(L[:70]))
          P
