name: dbg
on: { push: { branches: [cme-check] } }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip -q install pdfplumber
          git show origin/main:data.json > data.json 2>/dev/null || git fetch -q origin main && git show FETCH_HEAD:data.json > data.json
          cp data.json before.json
          python scripts/cme_final.py
          python - <<'P'
          import json
          a=json.load(open("before.json"))["DATA"]; b=json.load(open("data.json"))["DATA"]
          for g in ("corn","soybeans","wheat"):
              for s in ("near","far"):
                  x,y=a["grains"][g][s],b["grains"][g][s]
                  print(g,s,y.get("chain"),"|",x.get("oi_label"),"->",y.get("oi_label"))
                  print("   calls",x.get("calls"),"->",y.get("calls"),"puts",x.get("puts"),"->",y.get("puts"),"walls",x.get("call_wall"),x.get("put_wall"),"->",y.get("call_wall"),y.get("put_wall"))
                  dx={r[0]:(r[1],r[2]) for r in x["rows"]}; diffs=[(r[0],dx.get(r[0]),(r[1],r[2])) for r in y["rows"] if dx.get(r[0])!=(r[1],r[2])]
                  print("   strikes changed",len(diffs),"of",len(y["rows"]), diffs[:4])
          P
