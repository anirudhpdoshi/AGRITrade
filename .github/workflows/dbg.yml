name: dbg
on: { push: { branches: [cme-check] } }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip -q install pdfplumber
          git fetch -q origin main && git show FETCH_HEAD:data.json > data.json
          python scripts/cme_final.py
          python -c "import json;D=json.load(open('data.json'))['DATA'];[print(g,json.dumps(D['grains'][g].get('cme_months'))[:900]) for g in ('corn','soybeans','wheat')]"
