name: Deploy site
# Publishes the desk to GitHub Pages. Browser keys come from repository secrets and are published only
# sealed with the desk passcode (scripts/build_site.py) - never in plain text, never in the code or git history. Requires Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh desk data"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build site (keys sealed, never plain text)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DESK_PASSCODE: ${{ secrets.DESK_PASSCODE }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          pip install -q cryptography
          python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
