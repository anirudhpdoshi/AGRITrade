name: Deploy site
# Publishes the desk to GitHub Pages and injects browser keys from repository secrets at publish time,
# so they never live in the code or its git history. Requires Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh desk data"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Build site and inject keys
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          mkdir -p _site
          cp index.html live.js direct.js motion.js fwd.js data.json _site/
          [ -f README.md ] && cp README.md _site/ || true
          python3 - <<'PY'
          import json, os, re
          k = os.environ.get("FINNHUB_API_KEY", "").strip()
          if k and not re.fullmatch(r"[A-Za-z0-9_-]{8,80}", k):
              raise SystemExit("FINNHUB_API_KEY has an unexpected format - not injected")
          open("_site/config.js", "w").write("window.DESK_KEYS=" + json.dumps({"finnhub": k}) + ";\n")
          print("Finnhub key:", "present (" + str(len(k)) + " chars)" if k else "MISSING - add the FINNHUB_API_KEY secret")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
