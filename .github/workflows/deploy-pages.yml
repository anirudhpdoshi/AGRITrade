name: Deploy site
# Publishes the desk to GitHub Pages. Browser keys come from repository secrets and are published only
# sealed with the desk passcode (scripts/build_site.py) - never in plain text, never in the code or git history. Requires Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh desk data"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_try.outputs.page_url || steps.deploy_retry.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build site (keys sealed, never plain text)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DESK_PASSCODE: ${{ secrets.DESK_PASSCODE }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          pip install -q cryptography
          python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      # GitHub sometimes cannot find the just-uploaded artifact for a few seconds ("No artifacts named github-pages") —
      # wait, then retry twice before calling it a failure
      - name: Let the uploaded artifact register
        run: sleep 10
      - id: deploy_try
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry
        if: steps.deploy_try.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy_try.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before last try
        if: steps.deploy_try.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        run: sleep 60
      - id: deploy
        if: steps.deploy_try.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
