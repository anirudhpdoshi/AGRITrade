name: Index gamma (GEX)
# Cboe delayed option chains for SPX, NDX, DJX -> gex.json on the `gex` branch. Every 30 min through the US session
# (14:00–21:30 UTC, Mon–Fri) and on demand.
on:
  schedule:
    - cron: "12,42 14-21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gex
  cancel-in-progress: false
jobs:
  gex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Fetch chains, build gamma profile, publish gex.json
        run: python scripts/gex.py
