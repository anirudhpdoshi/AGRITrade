name: System health
# Live data & API health + scheduler & automation health. Dispatched every 15 min by the scheduler clock (:10/:25/:40/:55);
# the cron below is a backstop. Publishes health.json to the `health` branch. Reads public artifacts and this repo's
# Actions run list only; probes public provider endpoints without keys.
on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Unit tests (health)
        run: python tests/test_health.py
      - name: Check providers, feeds and schedules; publish health.json
        run: python scripts/health.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_ALERT_WEBHOOK: ${{ secrets.HEALTH_ALERT_WEBHOOK }}
