name: Refresh US indices data

on:
  schedule:
    # Weekdays after the US close (21:15 UTC = 4:15 PM EST / 5:15 PM EDT).
    - cron: "15 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indices-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install
        run: pip install -r scripts/requirements.txt

      - name: Recompute indices-data.json
        run: python scripts/indices.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- indices-data.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name  "desk-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indices-data.json
          git commit -m "indices: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
