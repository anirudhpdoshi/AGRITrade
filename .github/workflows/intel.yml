name: Global commodity intelligence
# World Bank Pink Sheet + CMO watch, IMF PCPS (backup / cross-check), FAO Food Price Index and institutional /
# supply-disruption headlines -> intel.json on the `intel` branch (read by the Intel tab). Hourly on weekdays,
# dispatched by scheduler.yml; the cron below is only a backstop. A failure here never touches the rest of the desk.
on:
  schedule:
    - cron: "50 11-22/3 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: intel
  cancel-in-progress: false
jobs:
  intel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt imfp
      - name: Unit tests (parsers, surprises, transmission rules, headline classifier)
        run: python tests/test_intel.py
      - name: Fetch, classify, publish intel.json
        run: python scripts/intel.py
