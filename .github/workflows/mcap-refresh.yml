name: Refresh US market cap

on:
  schedule:
    # Weekdays after the US close (21:25 UTC).
    - cron: "25 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcap-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install
        run: pip install -r scripts/requirements.txt

      - name: Recompute mcap.json
        run: python scripts/mcap.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- mcap.json scripts/data/mcap_universe.json && [ -z "$(git status --porcelain -- mcap.json scripts/data/mcap_universe.json)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name  "desk-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcap.json scripts/data/mcap_universe.json
          git commit -m "mcap: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
