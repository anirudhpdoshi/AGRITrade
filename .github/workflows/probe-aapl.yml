name: probe-aapl
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 60 --compressed -H "Origin: https://anirudhpdoshi.github.io" -o a.json -w "%{http_code}" "https://agritrade-sec.anirudh-p-doshi.workers.dev/company?t=AAPL" > code.txt
          python3 - <<'PY'
          import json
          c=open("code.txt").read()
          try:
              j=json.load(open("a.json"))
          except Exception as e:
              print(f"::notice::HTTP {c} not json {e}"); raise SystemExit
          co=j.get("co") or j.get("company") or j
          f=co.get("filings") or j.get("filings") or []
          print(f"::notice::HTTP {c} keys={list(j.keys())[:12]} fye={co.get('fiscalYearEnd')}")
          print("::notice::filings " + str([(x.get('form'),x.get('filed'),x.get('items')) for x in f[:8]]))
          PY
