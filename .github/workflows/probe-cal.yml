name: probe-cal
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, json, re
          B={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36","Accept":"application/json, text/plain, */*","Origin":"https://www.nasdaq.com","Referer":"https://www.nasdaq.com/"}
          out=[]
          try:
              j=json.loads(urllib.request.urlopen(urllib.request.Request("https://api.nasdaq.com/api/calendar/earnings?date=2026-11-03",headers=B),timeout=25).read())
              rows=(j.get("data") or {}).get("rows") or []
              out.append(f"NASDAQ rows={len(rows)} keys={list(rows[0].keys()) if rows else None}")
              out.append("sample="+json.dumps([{k:r.get(k) for k in ('symbol','name','time','epsForecast','marketCap','fiscalQuarterEnding','noOfEsts','lastYearEPS')} for r in rows[:4]])[:700])
              out.append("times="+str(sorted({r.get('time') for r in rows})))
          except Exception as e: out.append("NASDAQ ERR "+str(e)[:80])
          try:
              t=urllib.request.urlopen(urllib.request.Request("https://en.wikipedia.org/wiki/List_of_S%26P_500_companies",headers={"User-Agent":"AGRITrade-desk/1.0 (+https://github.com/anirudhpdoshi/AGRITrade)"}),timeout=25).read().decode()
              tk=re.findall(r'<td><a[^>]*class="external text"[^>]*>([A-Z.]{1,6})</a>',t)
              out.append(f"WIKI sp500 tickers={len(tk)} {tk[:5]}")
          except Exception as e: out.append("WIKI ERR "+str(e)[:80])
          for x in out: print("::notice::"+x[:900])
          PY
