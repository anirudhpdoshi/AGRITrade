name: probe-eps
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: {SEC_CONTACT: "${{ secrets.SEC_CONTACT }}"}
        run: |
          cd scripts && python3 - <<'PY'
          import json, re, time, urllib.request, pr_parse as P
          U=json.load(open("data/_probe_ex.json"))
          for s,u in list(U.items())[:10]:
              time.sleep(0.3)
              try:
                  h=urllib.request.urlopen(urllib.request.Request(u,headers=P.SEC_UA),timeout=25).read().decode("utf8","ignore")
                  t=P._T(); t.feed(h); L=[]
                  for T in t.tables:
                      for r in T:
                          lab,n=P._row(r)
                          if re.search(r"share|diluted|eps",lab) and n: L.append(f"{lab[:70]}={n[:2]}")
                  print(f"::notice::{s} "+" || ".join(L[:6])[:900])
              except Exception as e: print(f"::notice::{s} ERR {str(e)[:60]}")
          PY
