name: probe-pmi
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          FMP: ${{ secrets.FMP }}
          FH: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request
          H={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36","Accept":"*/*"}
          def g(u):
              return urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=25).read().decode("utf8","ignore")
          def n(tag,msg): print(f"::notice::{tag} {msg}"[:900])
          try:
              j=json.loads(g("https://nfs.faireconomy.media/ff_calendar_thisweek.json"))
              n("FF",[(e["country"],e["title"],e["date"],e.get("forecast")) for e in j if e["country"] in("USD","CAD") and "PMI" in e["title"]])
          except Exception as e: n("FF ERR",str(e)[:100])
          for u in ["https://www.prnewswire.com/news/institute-for-supply-management/?page=1&pagesize=100","https://www.prnewswire.com/news/institute-for-supply-management/?page=2&pagesize=100"]:
              try:
                  t=g(u); m=re.findall(r'(manufacturing|services)-pmi-at-([0-9-]+?)-(january|february|march|april|may|june|july|august|september|october|november|december)-(\d{4})',t,re.I)
                  n("PRN",f"{len(m)} first={m[:2]} last={m[-2:]}")
              except Exception as e: n("PRN ERR",str(e)[:100])
          for u in ["https://www.newswire.ca/news/ivey-business-school/","https://www.newswire.ca/news-releases/?keyword=ivey%20pmi","https://www.ivey.uwo.ca/ivey-pmi/"]:
              try:
                  t=g(u); m=re.findall(r'href="([^"]*pmi[^"]*)"',t,re.I)[:5]; n("IVEY",f"{u[:40]} len={len(t)} {m} {re.findall(r'PMI[^<]{0,80}',t)[:3]}")
              except Exception as e: n("IVEY ERR",u[:40]+str(e)[:80])
          PY
