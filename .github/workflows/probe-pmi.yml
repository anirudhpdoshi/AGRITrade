name: probe-pmi
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          FMP: ${{ secrets.FMP }}
          FH: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request
          H={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36","Accept":"*/*"}
          def g(u):
              return urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=25).read().decode("utf8","ignore")
          def n(tag,msg): print(f"::notice::{tag} {msg}"[:900])
          for u in ["https://iveypmi.uwo.ca/historic-data/","https://iveypmi.uwo.ca/"]:
              try:
                  t=g(u); x=re.sub(r"<[^>]+>"," ",t); x=re.sub(r"\s+"," ",x)
                  i=x.find("2026"); n("IV",f"{u} len={len(t)} links={re.findall(r'href=.([^ >]*(?:xls|csv|pdf)[^ >]*)',t)[:4]} :: {x[max(0,i-300):i+500]}")
              except Exception as e: n("IV ERR",str(e)[:80])
          PY
