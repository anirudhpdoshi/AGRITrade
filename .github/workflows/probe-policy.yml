name: Probe policy sources (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: probe
        run: |
          python - <<'PY'
          import sys, re, requests
          sys.path.insert(0, "scripts")
          import policy_watch as P
          from datetime import date
          for u in ["https://www.bankofcanada.ca/content_type/press-releases/feed/", "https://www.federalreserve.gov/feeds/press_monetary.xml"]:
              try:
                  r = requests.get(u, headers=P.UA, timeout=20); items = re.findall(r"(?s)<item>(.*?)</item>", r.text)
                  print(u, r.status_code, len(items))
                  for it in items[:8]:
                      t = re.search(r"<title>(.*?)</title>", it); l = re.search(r"<link>(.*?)</link>", it); d = re.search(r"<pubDate>(.*?)</pubDate>", it)
                      print("   ", t and t.group(1)[:90], "|", l and l.group(1), "|", d and d.group(1))
              except Exception as e:
                  print(u, "ERR", e)
          for d in [date(2026,9,9), date(2026,9,16), date(2026,9,17), date(2026,7,29), date(2026,7,15), date(2026,10,8)]:
              for name, fn in (("boc", P._boc), ("fed", P._fed)):
                  try:
                      g = fn(d)
                      if g: print("FOUND", name, d, g["url"], g["rate"], g["verb"], P.tone(g["text"], 0, None)["tone"], g["text"][:160])
                  except Exception as e:
                      print(name, d, "ERR", e)
          PY
