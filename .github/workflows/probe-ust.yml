name: probe-ust
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, json
          B="https://api.fiscaldata.treasury.gov/services/api/fiscal_service/"
          out=[]
          for u in ["v2/accounting/od/debt_to_penny?sort=-record_date&page[size]=1",
                    "v2/accounting/od/avg_interest_rates?sort=-record_date&page[size]=14",
                    "v1/debt/mspd/mspd_table_1?sort=-record_date&page[size]=12",
                    "v1/debt/mspd/mspd_table_3_market?sort=-record_date&page[size]=3"]:
              try:
                  j=json.loads(urllib.request.urlopen(urllib.request.Request(B+u.replace("[","%5B").replace("]","%5D"),headers={"User-Agent":"agritrade-desk/1.0"}),timeout=30).read())
                  d=j.get("data") or []
                  out.append(f"{u.split('?')[0]} n={j.get('meta',{}).get('total-count')} fields={list(d[0].keys()) if d else None} sample={json.dumps(d[:3])[:700]}")
              except Exception as e: out.append(f"{u[:40]} ERR {str(e)[:80]}")
          for x in out: print("::notice::"+x[:1000])
          PY
