name: probe-vec
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, json
          V=[2062811,2062815,65201210,62305752,52300157,1675115467,800025,52367637,1230996007,1481212145,41690973]
          b=json.dumps([{"vectorId":v} for v in V]).encode()
          j=json.loads(urllib.request.urlopen(urllib.request.Request("https://www150.statcan.gc.ca/t1/wds/rest/getSeriesInfoFromVector",data=b,headers={"Content-Type":"application/json","User-Agent":"agritrade-desk/1.0"}),timeout=30).read())
          out=[]
          for x in j:
              o=x.get("object") or {}
              out.append(f"v{o.get('vectorId')} pid={o.get('productId')} scal={o.get('scalarFactorCode')} uom={o.get('memberUomCode')} f={o.get('frequencyCode')} :: {o.get('SeriesTitleEn','')[:150]}")
          for i in range(0,len(out),3): print("::notice::"+" ||| ".join(out[i:i+3]))
          PY
