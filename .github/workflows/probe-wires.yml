name: probe-wires
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, re
          H={"User-Agent":"AGRITrade-desk/1.0 (+https://github.com/anirudhpdoshi/AGRITrade)"}
          for k,u in [("fed","https://www.federalreserve.gov/feeds/press_all.xml"),("boc","https://www.bankofcanada.ca/content_type/press-releases/feed/"),("cftc","https://www.cftc.gov/RSS/RSSGP/rssgp.xml"),("stc","https://www150.statcan.gc.ca/n1/rss/dai-quo/0-eng.atom")]:
              t=urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=20).read().decode("utf8","ignore")
              b=re.search(r"<(item|entry)\b.*?</(item|entry)>",t,re.S)
              x=re.sub(r"\s+"," ",b.group(0))[:600] if b else t[:300]
              print("::notice::"+k+" "+x.replace("<","[").replace(">","]"))
          PY
