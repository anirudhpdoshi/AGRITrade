name: probe-wires
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - env: {SEC_CONTACT: "${{ secrets.SEC_CONTACT }}"}
        run: |
          cd scripts && python3 - <<'PY'
          from datetime import datetime, timezone
          import wires as W
          it, h = W.fetch(datetime.now(timezone.utc))
          print("::notice::health " + str(h))
          print("::notice::kept " + str(len(it)) + " breaking " + str(sum(i['breaking'] for i in it)) + " by src " + str({s: sum(1 for i in it if i['srck']==s) for s in {i['srck'] for i in it}}))
          for i in range(0, min(len(it), 24), 6):
              print("::notice::" + " ||| ".join(f"[{x['src']}{'*' if x['breaking'] else ''}] {x['title'][:80]} {x['tick']}" for x in it[i:i+6]))
          PY
