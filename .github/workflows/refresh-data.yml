name: Refresh desk data

on:
  schedule:
    # Every 15 min, 11:00–22:45 UTC on weekdays ≈ 7am–6:45pm Toronto (EDT).
    # GitHub runs scheduled jobs late under load — expect 5–15 min drift.
    - cron: "*/15 11-22 * * 1-5"
    # One evening sweep for BoC daily rate, Treasury/BoC yield closes and Friday's CFTC.
    - cron: "30 0 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install
        run: pip install -r scripts/requirements.txt

      - name: Update data.json
        run: python scripts/update_data.py
        env:
          FAS_API_KEY: ${{ secrets.FAS_API_KEY }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name  "desk-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
