name: SEC company engine validation
# Runs co-engine.js against live SEC EDGAR filings for the spec's validation companies and prints an audit to the log.
# Manual only; nothing is stored or published. SEC requires a contact in the User-Agent (set in the script).
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers to validate"
        type: string
        default: "META GOOGL MSFT JPM ABBV XOM WMT CAT PLD NEE DOW ADM DE"
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node tests/co_engine.test.js
      - name: Validate on live SEC data
        run: node scripts/sec_validate.js ${{ inputs.tickers }} | tee /tmp/audit.txt; exit ${PIPESTATUS[0]}
      - name: Keep the audit text on the sec-audit branch (developer check only)
        if: always()
        run: |
          git config user.name desk-audit-bot; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -q --orphan sec-audit && git rm -rqf . && cp /tmp/audit.txt audit.txt && git add audit.txt
          git commit -qm "sec audit $(date -u +%FT%TZ)" && git push -qf origin HEAD:sec-audit
