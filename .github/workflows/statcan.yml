name: StatCan refresh (owner's machine)
# Statistics Canada blocks cloud servers (security check, since Nov 17, 2026), so the Canadian blocks run on the desk
# owner's own computer through a self-hosted runner labelled "statcan". Only schedule and manual runs: never pull requests.
on:
  schedule:
    - cron: "36 13 * * 1-5"    # 8:36 AM EST, just after StatCan's 8:30 releases
    - cron: "6 15,19 * * 1-5"  # catch-ups
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: statcan
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: [self-hosted, statcan]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet requests
      - name: Canadian blocks (StatCan)
        run: python scripts/update_data.py --only ca_provinces,cpi_detail_ca,ca_cpi_weights,canada,ca_retail,macro,macro_parts,ext
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          FAS_API_KEY: ${{ secrets.FAS_API_KEY }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- data.json; then echo "No data changes."; exit 0; fi
          git config user.name  "desk-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "data: StatCan refresh (owner runner) $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
