name: Tests
on:
  push:
    paths: ["fwd.js", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node tests/fwd.test.js
