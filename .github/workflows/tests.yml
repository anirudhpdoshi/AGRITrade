name: Tests
on:
  push:
    paths: ["index.html", "desk-main.js", "desk.css", "events-ui.js", "policy-ui.js", "briefing-ui.js", "scripts/briefing.py", "scripts/optflow.py", "optflow-ui.js", "scripts/legislation.py", "live.js", "fwd.js", "scripts/world.py", "scripts/global_grains.py", "scripts/intel.py", "scripts/update_data.py", "scripts/policy_watch.py", "scripts/live_loop.py", "scripts/us_earnings.py", "scripts/us_market.py", "co-engine.js", "company-ui.js", "earnings-ui.js", "tests/**", ".github/workflows/tests.yml", "core.js", "scripts/desknet.py", "scripts/ud_*.py", "scripts/update_data.py", "scripts/policy_intel.py", ".github/workflows/tests.yml"]
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Every page script parses
        run: for f in *.js; do node --check "$f" || exit 1; done
      - run: node tests/fwd.test.js
      - run: node tests/co_engine.test.js
      - run: node tests/grains.test.js
      - run: node tests/oi_integrity.test.js
      - run: node tests/rows.test.js
      - run: node tests/obs.test.js
      - run: node tests/swot.test.js && node tests/fed.test.js
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r scripts/requirements.txt   # once, before any Python test (briefing/legislation import requests)
      - run: python tests/test_world.py
      - run: python tests/test_global_grains.py
      - run: python tests/test_intel.py
      - run: python tests/test_briefing.py
      - run: python tests/test_optflow.py
      - run: python tests/test_legislation.py
      - run: python tests/test_us_earnings.py
      - run: python tests/test_us_market.py
      - run: python tests/test_alerts.py
      - run: python tests/test_earn_watch.py
      - run: python tests/test_pr_parse.py
      - run: python tests/test_wires.py
      - run: python tests/test_sp_schedule.py
      - run: python tests/test_bea_fastlane.py && python tests/test_roll.py && python tests/test_health.py && python tests/test_publish.py
      - run: python tests/test_yields.py
      - run: python tests/test_policy_intel.py
      - name: Lint (syntax errors and undefined names only)
        run: pip install -q ruff && ruff check scripts tests --select E9,F63,F7,F82
  e2e:
    # the release flow end to end in a real browser: landed / awaiting / calendar-only rows, "See it" jump, NEW tabs and
    # cards, Milestones feed for macro, options and central-bank releases, wall shifts, and no NaN/undefined on any tab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - run: python tests/e2e_release_flow.py
