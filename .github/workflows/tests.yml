name: Tests
on:
  push:
    paths: ["fwd.js", "scripts/world.py", "scripts/global_grains.py", "scripts/intel.py", "scripts/update_data.py", "scripts/policy_watch.py", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node tests/fwd.test.js
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tests/test_world.py
      - run: python tests/test_global_grains.py
      - run: python tests/test_intel.py
      - run: pip install -q -r scripts/requirements.txt && python tests/test_yields.py
