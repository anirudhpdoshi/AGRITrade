name: World markets
# Global markets monitor + alert engine. Every 15 min from Sunday through Friday (UTC), i.e. through the Asian,
# European and North American sessions and the FX week. Publishes world.json to the `world` branch.
on:
  schedule:
    - cron: "7,22,37,52 * * * 0-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: world-markets
  cancel-in-progress: false
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Unit tests (alert engine)
        run: python tests/test_world.py
      - name: Fetch, evaluate alerts, publish world.json
        run: python scripts/world.py
        env:
          WORLD_ALERT_WEBHOOK: ${{ secrets.WORLD_ALERT_WEBHOOK }}
